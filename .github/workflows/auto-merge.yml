name: Auto Merge Contributor PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

jobs:
  validate-and-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Validate and Auto-Merge PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const author = pr.user.login;
            const headSha = pr.head.sha;
            const headRepoOwner = pr.head.repo.owner.login;
            const headRepoName = pr.head.repo.name;

            // Check if already merged
            if (pr.merged) {
              console.log(`PR #${prNumber} is already merged.`);
              return;
            }

            const errors = [];

            // 1. List PR files
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            if (files.length !== 1) {
              errors.push(`You must change exactly 1 file, but this PR touches ${files.length} files. Please add only your own contributor file.`);
            }

            let validFile = null;
            if (files.length === 1) {
              const file = files[0];
              const normalizedPath = file.filename.replace(/\\/g, '/');

              if (file.status !== 'added') {
                errors.push(`File status must be "added". You cannot modify or delete existing files.`);
              }

              const expectedPath = `contributors/${author.toLowerCase()}.txt`;
              if (normalizedPath.toLowerCase() !== expectedPath) {
                errors.push(`File must be named "contributors/${author}.txt" (found: "${file.filename}"). Filename must match your GitHub username.`);
              }

              if (author.toLowerCase().startsWith('example')) {
                errors.push('Usernames starting with "example" cannot submit contributions.');
              }

              validFile = file;
            }

            // 2. Fetch and validate file content
            let displayName = '';
            if (validFile && errors.length === 0) {
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: headRepoOwner,
                  repo: headRepoName,
                  path: validFile.filename,
                  ref: headSha
                });

                if (!data || !data.content) {
                  errors.push('Could not read the file content from the pull request.');
                } else {
                  const content = Buffer.from(data.content, 'base64').toString('utf8');
                  const lines = content.split(/\r?\n/).filter(line => line.trim().length > 0);

                  if (lines.length === 0) {
                    errors.push('The file is empty. Please type your display name.');
                  } else if (lines.length > 1) {
                    errors.push('The file must contain exactly ONE line with your display name.');
                  } else {
                    displayName = lines[0].trim();

                    if (displayName.length < 1 || displayName.length > 30) {
                      errors.push(`Display name must be between 1 and 30 characters (currently ${displayName.length} characters).`);
                    }

                    if (/[<>&"'/\\;{}[\]()=]/.test(displayName)) {
                      errors.push('Display name cannot contain HTML tags, quotes, or code symbols.');
                    }

                    // Unicode letters and marks (accents, matras, viramas), spaces, dots, hyphens only
                    if (!/^[\p{L}\p{M}\s.-]{1,30}$/u.test(displayName)) {
                      errors.push('Display name can only contain letters, spaces, dots, and hyphens (Unicode letters allowed).');
                    }

                    if (!/\p{L}/u.test(displayName)) {
                      errors.push('Display name must contain at least one letter.');
                    }
                  }
                }
              } catch (fetchErr) {
                errors.push(`Failed to fetch file content from head repository: ${fetchErr.message}`);
              }
            }

            // 3. Handle errors if invalid
            if (errors.length > 0) {
              const errorBody = `### ❌ Contribution Check Failed

Hi @${author}, thanks for submitting your pull request! We found a few issues that need to be resolved before your piece can be added to the wall:

${errors.map(e => `- ${e}`).join('\n')}

---
### 🛠️ How to fix this:
1. Go to your fork of this repository.
2. Make sure you only have ONE file: \`contributors/${author}.txt\`.
3. Check that the file has only ONE line containing your display name (1–30 characters, letters/spaces/dots/hyphens only).
4. Commit your changes to your fork branch, and this pull request will update automatically!`;

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber
              });

              const botComment = comments.find(c => c.user && c.user.type === 'Bot' && c.body.includes('Contribution Check'));
              if (botComment) {
                if (botComment.body !== errorBody) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: botComment.id,
                    body: errorBody
                  });
                }
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: errorBody
                });
              }

              core.setFailed(`Validation failed: ${errors.join('; ')}`);
              return;
            }

            // 4. If valid: post friendly comment and merge
            const welcomeMsg = `Welcome aboard, **${displayName}**! Your piece is on the wall 🧩\n\nWatch it live: https://itsmeaadeesh.github.io/githubdevdays-first-commit/`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: welcomeMsg
            });

            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                merge_method: 'squash',
                commit_title: `feat(contributors): add ${author} (${displayName}) (#${prNumber})`
              });
              console.log(`Successfully merged PR #${prNumber}`);
            } catch (mergeErr) {
              const conflictMsg = `⚠️ @${author}, we tried to merge your pull request, but encountered a merge conflict: ${mergeErr.message}. Please rebase or update your branch.`;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: conflictMsg
              });
              core.setFailed(conflictMsg);
              return;
            }

            // 5. Trigger build-contributors.yml workflow
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'build-contributors.yml',
                ref: 'main'
              });
              console.log('Successfully triggered build-contributors.yml workflow');
            } catch (dispatchErr) {
              console.warn(`Could not dispatch build-contributors.yml: ${dispatchErr.message}`);
            }
