name: Build Contributors

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'contributors/**'

concurrency:
  group: build-contributors
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build contributors.json
        run: node scripts/build-contributors.js

      - name: Commit and push changes if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contributors.json

          if git diff --staged --quiet; then
            echo "contributors.json is already up to date. Nothing to commit."
          else
            git commit -m "chore: update contributors.json [skip ci]"
            for i in 1 2 3; do
              echo "Pushing changes (attempt $i/3)..."
              if git pull --rebase origin main && git push origin main; then
                echo "Successfully pushed contributors.json"
                exit 0
              fi
              echo "Push failed, waiting 3s before retry..."
              sleep 3
            done
            echo "Failed to push contributors.json after 3 attempts"
            exit 1
          fi
